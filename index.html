<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blom Start</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap">
<style>
:root{--ink:#3A3A3A;--wit:#FFFFFF;--grijs:#F8F8F8;--n300:#EFEFEC;--n500:#DEDED8;--g400:#616161;--fout:#B3261E;
  --display:"Roc Grotesk",roc-grotesk,"Plus Jakarta Sans",Verdana,sans-serif;--body:"Plus Jakarta Sans",Verdana,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--wit);color:var(--ink);font-family:var(--body);font-weight:300;font-size:14px;line-height:1.45}
a{color:var(--ink)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.eye{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;color:var(--g400)}
[hidden]{display:none!important}

/* inloggen */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.login form{width:100%;max-width:380px;display:grid;gap:12px}
.login h1{font-family:var(--display);font-weight:500;font-size:30px;line-height:1.05;margin:0}
.login p{margin:0;font-size:13px;color:var(--g400)}
.login input{height:46px;border:1px solid var(--ink);border-radius:0;padding:0 12px;font:inherit;font-size:16px;color:inherit;background:#fff}
.login button{height:46px;border:0;border-radius:0;background:var(--ink);color:#fff;font-family:var(--display);font-weight:500;font-size:15px;cursor:pointer}
.login button.link{background:none;color:var(--ink);height:auto;font-family:inherit;font-weight:400;font-size:12.5px;text-decoration:underline;justify-self:start;padding:0}
.login button:disabled{opacity:.5;cursor:default}
.login .fout{color:var(--fout)}

/* startpagina */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:18px max(16px,4vw);border-bottom:1px solid var(--n500)}
.top .merk{font-family:var(--display);font-weight:500;font-size:18px}
.top .wie{font-size:12px;color:var(--g400);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.top .wie button{border:0;background:none;padding:0;font:inherit;text-decoration:underline;color:var(--ink);cursor:pointer}
main{max-width:980px;margin:0 auto;padding:40px max(16px,4vw) 64px;display:grid;gap:32px}
main h1{font-family:var(--display);font-weight:500;font-size:clamp(28px,4vw,40px);line-height:1.05;margin:6px 0 0}
.groep{display:grid;gap:12px}
.tegels{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.tegel{display:grid;gap:6px;align-content:start;padding:20px;border:1px solid var(--ink);text-decoration:none;color:var(--ink);background:#fff;min-height:132px;transition:background .15s}
.tegel:hover{background:var(--grijs)}
.tegel b{font-family:var(--display);font-weight:500;font-size:19px}
.tegel span{font-size:13px;color:var(--g400)}
.tegel .lbl{justify-self:start;margin-top:auto;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;padding:3px 7px;background:var(--n300);color:var(--ink)}
.tegel.test{border-style:dashed}
.leeg{font-size:13px;color:var(--g400);margin:0}
footer{font-size:12px;color:var(--g400)}
@media (prefers-reduced-motion:reduce){.tegel{transition:none}}
</style>
</head>
<body>

<div class="login" id="login" hidden></div>

<div id="app" hidden>
  <header class="top">
    <span class="merk">Blom</span>
    <span class="wie"><span id="wieTekst"></span><button type="button" id="wwKnop">Wachtwoord wijzigen</button><button type="button" id="uitKnop">Uitloggen</button></span>
  </header>
  <main>
    <div>
      <span class="eye">Startpagina</span>
      <h1 id="groet">Welkom</h1>
    </div>
    <section class="groep">
      <span class="eye">Apps</span>
      <div class="tegels" id="apps"></div>
    </section>
    <section class="groep" id="beheerGroep" hidden>
      <span class="eye">Beheer</span>
      <div class="tegels" id="beheer"></div>
    </section>
    <footer>Je bent met één account ingelogd in alle Blom-apps. Uitloggen hier logt je overal uit.</footer>
  </main>
</div>

<script src="js/vendor/supabase-2.118.0.js"></script>
<script>
/* Blom startpagina: één keer inloggen met je Blom-account (Supabase, alleen @blominterieurs.nl).
   De apps staan op hetzelfde adres (blominterieurs.github.io/...) en delen daardoor de inlog: wie hier inlogt,
   is in de Collectiekeuze, het Doelgroepoverzicht en de Kerstkaarten automatisch ingelogd. */
(function () {
  const CFG = {
    url: 'https://vvvsvgtmslsjegbxppjf.supabase.co',
    anonKey: 'sb_publishable_NG__lC-SYFruk6q0KO3vsw_adHP5mLa', // openbare sleutel: data is afgeschermd met beveiligingsregels
    domein: '@blominterieurs.nl'
  };
  const BASIS = 'https://blominterieurs.github.io';
  const APPS = [
    { naam: 'Collectiekeuze', tekst: 'Collectie bekijken en je keuzes per leverancier maken.', url: BASIS + '/collectiekeuze/', alleen: 'collectie' },
    { naam: 'Doelgroepoverzicht', tekst: 'Enquête per label en segment, met posters per label.', url: BASIS + '/doelgroepoverzicht/' },
    { naam: 'Verslagmaker', tekst: 'Fireflies samenvatting omzetten naar een Blom verslag, als PDF of Word.', url: BASIS + '/verslagmaker/' },
    { naam: 'Kerstkaarten 2026', tekst: 'Wie krijgt een kerstkaart, met of zonder geschenk, en van wie komt die.', url: BASIS + '/kerstkaarten-2026/', alleen: 'collectie' }
  ];
  const BEHEER = [
    { naam: 'Collectiekeuze test', tekst: 'Testomgeving: tussenversies, keuzes tellen niet mee voor live.', url: BASIS + '/collectiekeuze/test/', test: true },
    { naam: 'GitHub', tekst: 'Code van alle apps in de organisatie blominterieurs.', url: 'https://github.com/blominterieurs' }
  ];

  const sb = window.supabase.createClient(CFG.url, CFG.anonKey, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
  });
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const isBlom = u => !!(u && u.email && u.email.toLowerCase().endsWith(CFG.domein));
  const scherm = $('login');
  let email = '', gestart = false;

  /* ---------- inloggen ---------- */
  function toonLogin(melding) { $('app').hidden = true; scherm.hidden = false; stapInloggen(melding); }
  function adresOk(inp, fout) {
    email = inp.value.trim().toLowerCase();
    if (email.endsWith(CFG.domein)) return true;
    fout.textContent = 'Alleen adressen eindigend op ' + CFG.domein + ' hebben toegang.'; fout.hidden = false; inp.focus(); return false;
  }
  function stapInloggen(melding) {
    scherm.innerHTML = `<form novalidate>
      <span class="eye">Blom</span>
      <h1>Inloggen</h1>
      <p>Log in met je Blom-account. Daarmee ben je meteen ingelogd in alle Blom-apps.</p>
      <input type="email" autocomplete="username" inputmode="email" placeholder="naam${CFG.domein}" aria-label="E-mailadres" required>
      <input type="password" autocomplete="current-password" placeholder="Wachtwoord" aria-label="Wachtwoord" required>
      <button type="submit">Inloggen</button>
      <p class="fout" ${melding ? '' : 'hidden'}>${melding ? esc(melding) : ''}</p>
      <button type="button" class="link">Nog geen wachtwoord, of vergeten? Stuur een inloglink</button></form>`;
    const f = scherm.querySelector('form'), [inp, ww] = f.querySelectorAll('input'), knop = f.querySelector('button[type=submit]'), fout = f.querySelector('.fout');
    inp.value = email; (email ? ww : inp).focus();
    f.querySelector('.link').onclick = () => { email = inp.value.trim().toLowerCase(); stapLink(); };
    f.onsubmit = async e => {
      e.preventDefault();
      if (!adresOk(inp, fout)) return;
      if (!ww.value) { ww.focus(); return; }
      knop.disabled = true; knop.textContent = 'Inloggen…';
      const { error } = await sb.auth.signInWithPassword({ email, password: ww.value });
      if (error) {
        knop.disabled = false; knop.textContent = 'Inloggen';
        fout.textContent = /invalid login|credentials/i.test(error.message)
          ? 'E-mailadres of wachtwoord klopt niet. Nog geen wachtwoord? Gebruik de inloglink hieronder.'
          : 'Inloggen lukte niet: ' + error.message;
        fout.hidden = false;
      }
    };
  }
  function stapLink() {
    scherm.innerHTML = `<form novalidate>
      <span class="eye">Blom</span>
      <h1>Inloglink</h1>
      <p>Vul je Blom e-mailadres in. Je krijgt een mail met een inloglink. Daarna kies je een wachtwoord en heb je geen mail meer nodig.</p>
      <input type="email" autocomplete="email" inputmode="email" placeholder="naam${CFG.domein}" aria-label="E-mailadres" required>
      <button type="submit">Stuur inloglink</button>
      <p class="fout" hidden></p>
      <button type="button" class="link">Terug naar inloggen met wachtwoord</button></form>`;
    const f = scherm.querySelector('form'), inp = f.querySelector('input'), knop = f.querySelector('button[type=submit]'), fout = f.querySelector('.fout');
    inp.value = email; inp.focus();
    f.querySelector('.link').onclick = () => { email = inp.value.trim().toLowerCase(); stapInloggen(); };
    f.onsubmit = async e => {
      e.preventDefault();
      if (!adresOk(inp, fout)) return;
      knop.disabled = true; knop.textContent = 'Versturen…';
      const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true, emailRedirectTo: location.origin + location.pathname } });
      if (error) {
        knop.disabled = false; knop.textContent = 'Stuur inloglink';
        fout.textContent = /rate|limit|security purposes/i.test(error.message)
          ? 'Er kan nu even geen inlogmail worden verstuurd (maximaal 2 per uur). Heb je al een wachtwoord? Log daarmee in.'
          : 'Versturen lukte niet: ' + error.message;
        fout.hidden = false; return;
      }
      scherm.innerHTML = `<form novalidate><span class="eye">Blom</span><h1>Check je mail</h1>
        <p>We hebben een mail gestuurd naar <b>${esc(email)}</b>. Klik op de link in die mail en kies daarna een wachtwoord.</p>
        <button type="button">Inloggen met wachtwoord</button></form>`;
      scherm.querySelector('button').onclick = () => stapInloggen();
    };
  }
  function toonWachtwoord(eerste, verplicht) {
    scherm.hidden = false; $('app').hidden = true;
    const user = window.BLOM_USER;
    scherm.innerHTML = `<form novalidate>
      <span class="eye">Blom</span>
      <h1>${verplicht ? 'Kies je eigen wachtwoord' : eerste ? 'Kies een wachtwoord' : 'Wachtwoord wijzigen'}</h1>
      <p>${verplicht ? 'Je bent ingelogd met een tijdelijk wachtwoord van de beheerder. Kies nu een eigen wachtwoord.' : eerste ? 'Daarmee log je voortaan op elk apparaat in, zonder mail.' : 'Kies een nieuw wachtwoord.'} Minimaal 8 tekens.</p>
      <input type="email" autocomplete="username" value="${esc(user ? user.email : email)}" readonly hidden>
      <input type="password" autocomplete="new-password" placeholder="Nieuw wachtwoord" aria-label="Nieuw wachtwoord" minlength="8" required>
      <input type="password" autocomplete="new-password" placeholder="Herhaal wachtwoord" aria-label="Herhaal wachtwoord" minlength="8" required>
      <button type="submit">Wachtwoord opslaan</button>
      <p class="fout" hidden></p>
      ${verplicht ? '' : `<button type="button" class="link">${eerste ? 'Later' : 'Annuleren'}</button>`}</form>`;
    const f = scherm.querySelector('form'), [, w1, w2] = f.querySelectorAll('input'), knop = f.querySelector('button[type=submit]'), fout = f.querySelector('.fout');
    const meld = t => { fout.textContent = t; fout.hidden = false; };
    const terug = () => { scherm.hidden = true; $('app').hidden = false; };
    w1.focus();
    if (!verplicht) f.querySelector('.link').onclick = terug;
    f.onsubmit = async e => {
      e.preventDefault();
      if (w1.value.length < 8) return meld('Het wachtwoord moet minimaal 8 tekens hebben.');
      if (w1.value !== w2.value) return meld('De twee wachtwoorden zijn niet gelijk.');
      knop.disabled = true; knop.textContent = 'Opslaan…';
      const { data, error } = await sb.auth.updateUser({ password: w1.value, data: { wachtwoord: true, wachtwoord_wijzigen: false } });
      if (error) {
        knop.disabled = false; knop.textContent = 'Wachtwoord opslaan';
        return meld(/reauth/i.test(error.message) ? 'Log eerst opnieuw in met een inloglink en kies dan je wachtwoord.'
          : /weak|pwned|leaked/i.test(error.message) ? 'Dit wachtwoord is te zwak of komt voor in gelekte lijsten. Kies een ander.'
          : /same|different from the old/i.test(error.message) ? 'Dit is je huidige wachtwoord. Kies een ander.'
          : 'Opslaan lukte niet: ' + error.message);
      }
      if (data && data.user) window.BLOM_USER = data.user;
      terug();
    };
  }

  /* ---------- startpagina ---------- */
  function tegel(a) {
    const el = document.createElement('a');
    el.className = 'tegel' + (a.test ? ' test' : ''); el.href = a.url;
    if (/^https:\/\/github\.com/.test(a.url)) { el.target = '_blank'; el.rel = 'noopener'; }
    el.innerHTML = `<b>${esc(a.naam)}</b><span>${esc(a.tekst)}</span>${a.test ? '<em class="lbl">Test</em>' : ''}`;
    return el;
  }
  async function haalRol() {
    // rol in de Collectiekeuze (beheerder, beoordelaar, ...). Geen rol = geen toegang tot de Collectiekeuze.
    const { data, error } = await sb.rpc('mijn_rol');
    if (error) return null;
    return data;
  }
  async function ga(user) {
    if (gestart) return;
    gestart = true;
    window.BLOM_USER = user;
    const rol = await haalRol();
    const naam = (rol && rol.naam) || user.email.split('@')[0].split(/[._-]/)[0];
    $('groet').textContent = 'Welkom, ' + naam.charAt(0).toUpperCase() + naam.slice(1);
    $('wieTekst').textContent = 'Ingelogd als ' + user.email;
    const apps = $('apps'); apps.innerHTML = '';
    APPS.filter(a => a.alleen !== 'collectie' || rol).forEach(a => apps.appendChild(tegel(a)));
    const beheer = $('beheer'); beheer.innerHTML = '';
    const isBeheerder = rol && rol.rol === 'beheerder';
    if (isBeheerder) BEHEER.forEach(a => beheer.appendChild(tegel(a)));
    $('beheerGroep').hidden = !isBeheerder;
    scherm.hidden = true; $('app').hidden = false;
    const meta = user.user_metadata || {};
    if (meta.wachtwoord_wijzigen) setTimeout(() => toonWachtwoord(true, true), 0);
    else if (!meta.wachtwoord) setTimeout(() => toonWachtwoord(true), 0);
  }
  $('uitKnop').onclick = async () => { await sb.auth.signOut(); location.reload(); };
  $('wwKnop').onclick = () => toonWachtwoord(false);

  async function start() {
    sb.auth.onAuthStateChange((ev, s) => {
      if (s && isBlom(s.user)) setTimeout(() => ga(s.user), 0);
      else if (s && !isBlom(s.user)) { sb.auth.signOut(); toonLogin('Dit account heeft geen toegang. Gebruik je ' + CFG.domein + ' adres.'); }
      else if (ev === 'SIGNED_OUT') { gestart = false; toonLogin(); }
    });
    const { data } = await sb.auth.getSession();
    const s = data && data.session;
    if (s && isBlom(s.user)) ga(s.user);
    else { if (s) await sb.auth.signOut(); toonLogin(); }
  }
  start();
})();
</script>
</body>
</html>
